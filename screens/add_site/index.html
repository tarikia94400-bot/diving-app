<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

                    "outline-variant": "#bfc7d1",
                    "on-background": "#191c1d",
                    "primary-container": "#0077b6",

                    "inverse-primary": "#94ccff",

                    "surface-container-high": "#e7e8e9",
                    "on-tertiary": "#ffffff",

                    "error": "#ba1a1a",
                    "secondary": "#00677d",
                    "on-surface-variant": "#404850",
                    "tertiary-container": "#227c8a",
                    "secondary-fixed-dim": "#4cd6fb",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "secondary-container": "#50d9fe",
                    "primary": "#005d90",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#94ccff",
                    "on-secondary-container": "#005c70",

                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f3f4f5",

                    "primary-fixed": "#cde5ff",
                    "on-primary": "#ffffff",
                    "surface": "#f8f9fa",
                    "surface-container-highest": "#e1e3e4",
                    "background": "#f8f9fa",
                    "on-primary-container": "#f3f7ff",
                    "on-primary-fixed-variant": "#004b74"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",

                    "xl": "0.75rem",
                    "full": "9999px"

                    "xxl": "48px",
                    "margin": "20px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "label-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "label-sm": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-xl": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-lg": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}],

                    "label-sm": ["12px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "500"}],
                    "headline-xl": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-bubble {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 40px -10px rgba(0, 119, 182, 0.15);
        }
        .depth-shadow {
            box-shadow: 0 20px 50px -12px rgba(0, 119, 182, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen pb-xxl">
<!-- Top Navigation -->
<nav class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border-b border-white/30 dark:border-slate-800/50 shadow-lg shadow-sky-900/5 flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">waves</span>
<span class="text-xl font-black text-sky-700 dark:text-sky-400 font-['Plus_Jakarta_Sans'] tracking-tight">DiveHub</span>
</div>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed border-2 border-white shadow-sm overflow-hidden">
<img class="w-full h-full object-cover" data-alt="professional portrait of a smiling female scuba diver in sunset lighting with blue tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDlzDghrpED35YVGAZ4QrJHRFzUF_z67I_S51PqdIkj9gJtDGQcyG34ddym7eC-V5o0nWr3tyuoTxgLkzNQjgPqi_NnCb0MlKAARdOOZOPQP1z_dFtzezb6IPsoH4iwPjZGxfctDPObpBylDZ00oKgTwp_bGPmi2MXX_apUEDgY9o7mlTVRT8AeXSGYJLyRz-CVZ7Cvaae6_8r9bI-g1WR0UcCsJT2MzYk2D_C1-qS8SCv7bDG1HnK8yP-48gUO4IRKZSFiTCffP1E"/>
</div>
<span class="material-symbols-outlined text-sky-600 dark:text-sky-400 hover:bg-sky-50/50 rounded-full p-2 transition-colors active:scale-95">notifications</span>
</div>
</nav>
<main class="max-w-2xl mx-auto px-margin mt-xl">
<!-- Header & Stepper -->
<header class="mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Share a New Site</h1>
<p class="text-on-surface-variant font-body-md">Help the community discover amazing underwater worlds.</p>
<!-- Step Indicators -->
<div class="flex items-center gap-md mt-lg">
<div class="flex-1 h-3 bg-secondary-container rounded-full relative overflow-hidden">
<div class="absolute inset-0 bg-primary w-2/3 rounded-full"></div>
</div>
<span class="font-label-lg text-label-lg text-primary whitespace-nowrap">Step 2 of 3</span>
</div>
</header>
<!-- Form Canvas -->
<div class="glass-bubble rounded-[32px] p-lg md:p-xl space-y-xl depth-shadow">
<!-- Section 1: Visuals -->
<section class="space-y-md">
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">photo_library</span>
<h2 class="font-headline-md text-headline-md">Dive Site Gallery</h2>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-md">
<!-- Upload Placeholder -->
<label class="aspect-square rounded-2xl border-4 border-dashed border-sky-100 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-sky-50 transition-colors group">
<input class="hidden" type="file"/>
<span class="material-symbols-outlined text-sky-300 group-hover:text-primary transition-colors text-3xl">add_a_photo</span>
<span class="font-label-sm text-label-sm text-sky-400">Add Photo</span>
</label>
<!-- Uploaded Image 1 -->
<div class="aspect-square rounded-2xl overflow-hidden relative group shadow-md">
<img class="w-full h-full object-cover" data-alt="vibrant coral reef underwater with clear blue water and sunlight rays piercing through" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7OEsiOZbn2pIgWTiHVUIFz5rVn8T4HdAEv7A_pSBVQ57ixNgyH-nOdx0-mzhNRxUKS5iX21WHr_R3Hyh36hr-2InwYlotkgbfeb-y9tstdSkKG9G-kbHt6h3fy5xp6hHFI2CACG-WZ2G2UP-aHilpP0Kd2pNjMe5Fv9a0VfAII08EDt4Lrky7QI5Fnj4a9tdxC2JqVCzqfnMXarW_gVuJhQsf7WdycXHqrh-_J0MCsQC_FZXrlzHCL7oh-GcwzDo7hac7VpD1vpk"/>
<button class="absolute top-2 right-2 w-8 h-8 bg-black/40 backdrop-blur-md rounded-full text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<!-- Uploaded Image 2 -->
<div class="aspect-square rounded-2xl overflow-hidden relative group shadow-md">
<img class="w-full h-full object-cover" data-alt="close up of a colorful sea turtle swimming near the ocean floor in tropical turquoise water" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKVBph-yCSgGVEDKMRqtnxduMlp2UexT5dS4bBO7Y51qkdny-aOrhw1eFcB4GDA8g0KUKBpxFAJ_VolKJOy2YWuG-Rn7ir5_wCRPBeEq5aLa3ukvKJSwc0kofZ7aoJcnMdDMSK7ZUgQDhf09rflhkgrEGW5uzCymyRamTyqykJH0yHRxxI4BWnlSt5Yl2sF81zz5wuAPfAfbedATeA6RraHgjiTYQSY9EhupOY_7Lwhw-q3TrtvASX28GdRfOfa88EjmlIAcGAZ6o"/>
<div class="absolute bottom-0 inset-x-0 h-1 bg-primary w-[75%] rounded-r-full"></div>
<div class="absolute inset-0 bg-white/20 flex items-center justify-center">
<span class="material-symbols-outlined text-white animate-pulse">sync</span>
</div>
</div>
</div>
</section>
<!-- Section 2: Details -->
<section class="space-y-lg">
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">description</span>
<h2 class="font-headline-md text-headline-md">Site Details</h2>
</div>
<!-- Input Field: Site Name -->
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface px-unit">Site Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-sky-400 group-focus-within:text-primary transition-colors">place</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary-container font-body-lg text-body-lg placeholder:text-outline-variant transition-all" placeholder="e.g. Blue Hole, Lighthouse Reef" type="text"/>
</div>
</div>
<!-- Grid Inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Input Field: Max Depth -->
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface px-unit">Max Depth (m)</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-sky-400 group-focus-within:text-primary transition-colors">height</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary-container font-body-lg text-body-lg placeholder:text-outline-variant transition-all" placeholder="30" type="number"/>
</div>
</div>
<!-- Input Field: Visibility -->
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface px-unit">Avg. Visibility</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-sky-400 group-focus-within:text-primary transition-colors">visibility</span>
</div>
<select class="w-full pl-12 pr-4 py-4 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary-container font-body-lg text-body-lg transition-all appearance-none">
<option>Crystal Clear (30m+)</option>
<option selected="">Good (15-30m)</option>
<option>Moderate (5-15m)</option>
<option>Low (&lt;5m)</option>
</select>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-sky-400">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Description -->
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface px-unit">Tell us about the dive</label>
<textarea class="w-full p-4 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary-container font-body-md text-body-md placeholder:text-outline-variant transition-all" placeholder="What makes this site special? Describe the marine life, currents, and terrain..." rows="4"></textarea>
</div>
</section>
<!-- Section 3: Tags/Chips -->
<section class="space-y-md">
<label class="font-label-lg text-label-lg text-on-surface px-unit">Key Highlights</label>
<div class="flex flex-wrap gap-sm">
<button class="bg-secondary-container text-on-secondary-container px-md py-2 rounded-full font-label-lg text-label-lg flex items-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-base">set_meal</span>
                        Big Fish
                    </button>
<button class="bg-surface-container text-on-surface-variant px-md py-2 rounded-full font-label-lg text-label-lg flex items-center gap-2 hover:bg-sky-50 transition-colors">
<span class="material-symbols-outlined text-base">directions_boat</span>
                        Wreck
                    </button>
<button class="bg-secondary-container text-on-secondary-container px-md py-2 rounded-full font-label-lg text-label-lg flex items-center gap-2">
<span class="material-symbols-outlined text-base">landscape</span>
                        Cave
                    </button>
<button class="bg-surface-container text-on-surface-variant px-md py-2 rounded-full font-label-lg text-label-lg flex items-center gap-2">
<span class="material-symbols-outlined text-base">thunderstorm</span>
                        Current
                    </button>
<button class="border-2 border-dashed border-outline-variant text-outline px-md py-2 rounded-full font-label-lg text-label-lg flex items-center gap-2">
<span class="material-symbols-outlined text-base">add</span>
                        Add Tag
                    </button>
</div>
</section>
<!-- Actions -->
<footer class="pt-lg flex flex-col sm:flex-row gap-md">
<button class="flex-1 order-2 sm:order-1 bg-surface-container text-on-surface font-label-lg text-label-lg py-4 rounded-xl active:scale-95 transition-all">
                    Save Draft
                </button>
<button class="flex-[2] order-1 sm:order-2 bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl shadow-xl shadow-sky-700/20 active:scale-95 transition-all relative overflow-hidden group">
<span class="relative z-10 flex items-center justify-center gap-2">
                        Publish Site
                        <span class="material-symbols-outlined">rocket_launch</span>
</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
</button>
</footer>
</div>
</main>
<!-- Bottom Navigation Shell -->
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-8 bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl border-t border-white/40 dark:border-slate-800/30 shadow-[0_-10px_40px_rgba(0,119,182,0.12)] rounded-t-[32px]">
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-sky-500 transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold">Explore</span>
</div>
<div class="flex flex-col items-center justify-center bg-sky-100 dark:bg-sky-900/40 text-sky-700 dark:text-sky-200 rounded-[20px] px-5 py-2 active:scale-90 transition-all duration-200 ease-out">
<span class="material-symbols-outlined" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold">Add</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-sky-500 transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold">Favorites</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-sky-500 transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold">Profile</span>
</div>
</div>
</body></html>
